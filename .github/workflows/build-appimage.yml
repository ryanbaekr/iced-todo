name: Build
run-name: Building AppImage ${{ github.sha }}
on:
  push:
    branches:
      - main
jobs:
  Build-AppImage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.0
      - name: Install System Dependencies
        run: ./script/linux
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Release Binary
        run: cargo build --release --locked
      - name: Download linuxdeploy
        run: |
          mkdir -p tools
          curl -fsSL -o tools/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x tools/linuxdeploy-x86_64.AppImage
      - name: Build AppImage
        run: ./tools/linuxdeploy-x86_64.AppImage --appdir AppDir --executable target/release/IcedTODO --desktop-file assets/IcedTODO.desktop --icon-file assets/IcedTODO.png --output appimage
      - uses: actions/upload-artifact@v4
        with:
          name: IcedTODO-x86_64.AppImage
          path: IcedTODO-x86_64.AppImage
          if-no-files-found: error
